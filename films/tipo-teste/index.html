<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Bangers';src:url(fonts/bangers.woff2)}
@font-face{font-family:'Knewave';src:url(fonts/knewave.woff2)}
@font-face{font-family:'Permanent Marker';src:url(fonts/permanent-marker.woff2)}
@font-face{font-family:'Sedgwick';src:url(fonts/sedgwick-ave-display.woff2)}
@font-face{font-family:'Rubik Dirt';src:url(fonts/rubik-dirt.woff2)}
@font-face{font-family:'Freckle Face';src:url(fonts/freckle-face.woff2)}
@font-face{font-family:'Londrina';src:url(fonts/londrina-solid.woff2)}
@font-face{font-family:'Titan One';src:url(fonts/titan-one.woff2)}
html,body{margin:0;background:#0b0a09}
.cel{position:absolute;width:960px;height:540px;overflow:hidden}
.nome{position:absolute;left:12px;top:8px;color:#ff0;font:20px monospace;z-index:9}
</style><script src="lib/motion.js"></script><script src="lettering.js"></script></head><body>
<script>
const F=['Sedgwick','Permanent Marker'];
window.FILM={width:1920,height:2160,fps:30,duration:1};
window.ready=Promise.all(F.map(f=>document.fonts.load(`100px "${f}"`,'VAIFZERSNTDO'))).then(()=>{
  F.forEach((f,i)=>{
    const c=document.createElement('div');c.className='cel';c.style.left=(i%2)*960+'px';c.style.top=Math.floor(i/2)*540+'px';document.body.append(c);
    const n=document.createElement('div');n.className='nome';n.textContent=f;c.append(n);
    const a=LT.palavra(c,'VAI FAZER',{fonte:f,tam:150,tipo:'creme',semente:i+1,pingos:4});
    const b=LT.palavra(c,'SENTIDO',{fonte:f,tam:190,tipo:'fogo',semente:i+20,pingos:5});
    a.caixa.style.transform='translate(60px,40px) rotate(-3deg)'; b.caixa.style.transform='translate(110px,210px) rotate(-2deg)';
    LT.escorre(a,1,0,0.01);LT.escorre(b,1,0,0.01);
  });
});
window.seek=()=>{};
</script></body></html>
