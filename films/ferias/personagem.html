<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lâmpada Zinga</title>
<style>
  @font-face { font-family: "Switzer"; src: url("fonts/Switzer-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; }
  #folha { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Switzer", sans-serif; }
  .w { display: inline-block; white-space: pre; }
</style>
<script src="lib/motion.js"></script>
<script src="lib/nucleo.js"></script>
<script src="lib/zg.js"></script>
<script src="lib/traco.js"></script>
</head>
<body>
<div id="folha"></div>
<script>
// Ficha do personagem: as duas versões da lâmpada lado a lado, grandes (papel | rosa).
const f = document.getElementById('folha');
const papel = T.papel(f, { inset: 'auto', left: '0px', top: '0px', width: '960px', height: '1080px' });
const rosa = Z.div(f, { left: '960px', top: '0px', width: '960px', height: '1080px', background: 'linear-gradient(160deg, #f50953 0%, #c2073f 100%)' });
const rotulo = (pai, txt, cor) => { const d = Z.div(pai, { left: '64px', top: '56px', fontSize: '34px', fontWeight: 600, letterSpacing: '0.18em', color: cor }); d.textContent = txt; };
rotulo(papel, 'NO ESQUETE · CANSADA', '#f50953');
rotulo(rosa, 'NAS FÉRIAS · ACESA', '#002140');
const r1 = T.rabiscos(papel, [{ f: 'zz', x: 690, y: 250, s: 1.3, r: -8 }, { f: 'gota', x: 780, y: 360, s: 0.8 }, { f: 'espiral', x: 140, y: 900, s: 0.9 }, { f: 'risco', x: 480, y: 940, s: 4 }], { op: 0.35, semente: 3, w: 960, h: 1080 });
const r2 = T.rabiscos(rosa, [{ f: 'sol', x: 800, y: 230, s: 1.3 }, { f: 'onda', x: 480, y: 960, s: 1.6 }, { f: 'estrela', x: 140, y: 820, s: 0.7 }], { cor: '#ffffff', op: 0.45, semente: 8, w: 960, h: 1080 });
const a = T.lampada(papel, { x: 240, y: 200, tam: 480 });
const b = T.lampada(rosa, { x: 240, y: 200, tam: 480 });
const lixo = T.lixeira(papel, { x: 700, y: 700, tam: 170 });
window.ready = G.carregaLogo().then(() => document.fonts.ready).then(() => {
  a.seek({ humor: 'cansada', oculos: 0, luz: 0, bracoE: [18, 12], bracoD: [150, 60] });
  b.seek({ humor: 'feliz', oculos: 1, luz: 1, bracoE: [140, 30], bracoD: [140, 30] });
  r1.seek(0); r2.seek(0);
});
</script>
</body>
</html>
