<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Férias Zinga</title>
<style>
  /* Switzer (licença ITF FFL): o arquivo NÃO vai pro git (repositório público). Copie de
     design-system-zinga/fonts/Switzer-Variable.woff2 para films/ferias/fonts/ antes de renderizar. */
  @font-face { font-family: "Switzer"; src: url("fonts/Switzer-Variable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  /* contorno das palavras vazadas: instância Black com as sobreposições fundidas (fontTools instancer, overlap REMOVE).
     Sem isso o traço mostra os contornos internos da fonte variável (entrelaçado). Também só local, fora do git. */
  @font-face { font-family: "SwitzerContorno"; src: url("fonts/SwitzerContorno-Black.woff2") format("woff2"); font-weight: 900; font-style: normal; }
  :root { --titulo: "Switzer", sans-serif; --interface: "Switzer", sans-serif; }
  html, body { margin: 0; background: #000; }
  #palco { position: relative; overflow: hidden; font-family: var(--interface); color: #fff; }
  #fundo { position: absolute; inset: 0; }
  #luz { position: absolute; border-radius: 50%; filter: blur(140px); }
  #planos { position: absolute; inset: 0; z-index: 1; }
  #grao { position: absolute; inset: 0; z-index: 3; opacity: .06; mix-blend-mode: overlay; pointer-events: none; }
  .plano { position: absolute; inset: 0; perspective: 1800px; overflow: hidden; }
  .plano > .cam { position: absolute; inset: 0; transform-origin: 50% 45%; transform-style: preserve-3d; }
  #filtros { position: absolute; width: 0; height: 0; }
  .w { display: inline-block; white-space: pre; }
</style>
<script src="lib/motion.js"></script>
<script src="lib/audio.js"></script>
<script src="lib/nucleo.js"></script>
<script src="lib/zg.js"></script>
<script src="lib/traco.js"></script>
<script src="planos/p1-ano.js"></script>
<script src="planos/p2-caixa.js"></script>
<script src="planos/p3-bateria.js"></script>
<script src="planos/p5-ferias.js"></script>
<script src="planos/p6-logo.js"></script>
<script src="planos/som.js"></script>
</head>
<body>
<div id="palco"><div id="fundo"><div id="luz"></div></div><div id="planos"></div><div id="grao"></div></div>
<svg id="filtros" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const DURACAO = 28;                                  // 20 s do roteiro + 3 pausas de leitura de 1 s + logo reveal
window.FILM = { width: Z.W, height: Z.H, fps: 30, duration: DURACAO };
const palco = document.getElementById('palco');
palco.style.width = Z.W + 'px'; palco.style.height = Z.H + 'px';

window.ready = Promise.all([
  fetch('beats.json').then((r) => r.json()).catch(() => null),
  G.carregaLogo(),
  document.fonts.load('900 100px Switzer'), document.fonts.load('900 100px SwitzerContorno'), document.fonts.load('600 100px Switzer'), document.fonts.load('500 100px Switzer'),
]).then(async ([beats]) => {
  if (beats) Z.BEATS = beats.beats;
  Z.montaGrao();
  const host = document.getElementById('planos');
  Z.planos.sort((a, b) => a.z - b.z);
  for (const p of Z.planos) {
    p.el = Z.div(host, { inset: '0px', zIndex: p.z }, 'plano');
    p.cam = Z.div(p.el, {}, 'cam');
    await p.montar?.(p.cam, Z);
  }
  await document.fonts.ready;
});

// Pausas de leitura: o roteiro (tempo "virtual" dos planos p1 a p5) segura 1 s antes de cada transição dos três
// primeiros takes. Durante a pausa a imagem fica, mas a câmera respira e os rabiscos continuam fervendo (tempo real).
const PAUSAS = [[1.5, 1], [4.0, 1], [6.0, 1]];       // [instante no roteiro, duração]
G.virtual = (t) => {                                  // tempo real -> tempo do roteiro
  let desloc = 0;
  for (const [h, d] of PAUSAS) { const hr = h + desloc; if (t <= hr) break; if (t < hr + d) return h; desloc += d; }
  return t - desloc;
};
G.real = (v) => { let r = v; for (const [h, d] of PAUSAS) if (v > h + 1e-9) r += d; return r; };   // roteiro -> real (som)

window.seek = function (t) {
  Z.T_REAL = t;
  const v = G.virtual(t);
  G.fundo(t);
  for (const p of Z.planos) {
    // p.real: o plano é escrito em tempo real (logo). loopDe (tempo real): o plano também roda no fim, com o tempo
    // do começo (t - DURACAO), por baixo da emenda do loop
    const tp = p.real ? t : v;
    const volta = p.loopDe !== undefined && t >= p.loopDe;
    const ativo = volta || (tp >= p.inicio && (tp < p.fim || p.fim >= DURACAO));
    p.el.style.display = ativo ? '' : 'none';
    if (ativo) p.seek(volta ? t - DURACAO : tp, p.cam, Z);
  }
  let resp = 1;
  for (const [h] of PAUSAS) { const hr = G.real(h - 1e-6); resp += 0.014 * Math.sin(Math.PI * M.prog(t, hr, hr + 1)); }
  document.getElementById('planos').style.transform = `scale(${resp.toFixed(4)})`;
  Z.grao(document.getElementById('grao'), t);
};

// efeitos dos planos p1 a p5 foram agendados no tempo do roteiro: o proxy empurra cada um pro tempo real
const comPausas = (S) => new Proxy(S, { get(alvo, nome) {
  const f = alvo[nome];
  if (typeof f !== 'function') return f;
  return (...a) => {
    if ((nome === 'osc' || nome === 'ruid') && a[0] && typeof a[0].t === 'number') a[0] = { ...a[0], t: G.real(a[0].t) };
    else if (nome === 'riser') { a[0] = G.real(a[0]); a[1] = G.real(a[1]); }
    else if (typeof a[0] === 'number') a[0] = G.real(a[0]);
    return f(...a);
  };
} });

window.renderAudio = async function ({ trilha = true, foley = true } = {}) {
  const SR = 48000;
  const ctx = new OfflineAudioContext(2, Math.round(SR * (DURACAO + 1)), SR);
  const S = makeSynth(ctx, 0x2a1b);
  if (trilha) SOM.trilha(S);
  if (foley) { const SV = comPausas(S); for (const p of Z.planos) p.som?.(p.real ? S : SV, Z); }
  return S.exportar(0.6);
};

if (!new URLSearchParams(location.search).has('render')) {
  window.ready.then(() => {
    const q = new URLSearchParams(location.search);
    if (q.has('t')) { seek(Number(q.get('t'))); return; }
    const t0 = performance.now();
    const tick = () => { seek(((performance.now() - t0) / 1000) % FILM.duration); requestAnimationFrame(tick); };
    tick();
  });
}
</script>
</body>
</html>
